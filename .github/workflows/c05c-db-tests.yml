
name: C05c Database Security Tests

on:
  push:
    branches:
      - c05c-db-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Start disposable local database
        run: supabase db start

      - name: Run 30 C05c pgTAP assertions
        run: supabase test db supabase/tests/c05c_admin_security.sql
