name: IOJH Database Security — C05c through C07c

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/lib/jobs/**'
      - 'src/lib/notifications/**'
      - 'src/features/notifications/**'
      - 'src/app/api/internal/jobs/**'
      - 'src/app/admin/operations/**'
      - 'tests/unit/c07c*'
      - 'tests/e2e/c07c*'
      - 'tests/integration/**'
      - '.github/workflows/c05c-db-tests.yml'
  push:
    branches: [main, 'c05c-db-security', 'c06-*', 'c07-*', 'c07b-*', 'c07c-*']
    paths:
      - 'supabase/**'
      - 'src/lib/jobs/**'
      - 'src/lib/notifications/**'
      - 'src/features/notifications/**'
      - 'src/app/api/internal/jobs/**'
      - 'src/app/admin/operations/**'
      - 'tests/unit/c07c*'
      - 'tests/e2e/c07c*'
      - 'tests/integration/**'
      - '.github/workflows/c05c-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iojh-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable PostgreSQL and apply versioned migrations
        run: supabase db start
      - name: Test C05c authorization foundation
        run: supabase test db supabase/tests/c05c_admin_security.sql
      - name: Test C06 CMS and Storage isolation
        run: supabase test db supabase/tests/c06_cms_security.sql
      - name: Test C07a queue, outbox, leasing, and authorization
        run: supabase test db supabase/tests/c07a_jobs_security.sql
      - name: Test C07b notifications, suppression and authorization
        run: supabase test db supabase/tests/c07b_notifications_security.sql
      - name: Test C07c worker coordination and notification consistency
        run: supabase test db supabase/tests/c07c_runner_security.sql
      - name: Install isolated PostgreSQL concurrency-test client
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Test C07a independent-session concurrency and lease fencing
        env:
          IOJH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python tests/integration/c07a_concurrency.py
      - name: Test C07c independent-session runner coordination
        env:
          IOJH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python tests/integration/c07c_concurrency.py
